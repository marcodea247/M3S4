<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Pricing Table</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Pricing</h1>
  <main>
    
    <!--1--> 
    <div class="pricing-container"> 
      
    <div class="pricing-card"> 

        <h2> Básico</h2>
        <div class="price"> $2.99/mes</div>
        <ul> 
          <li>
            Sin anuncios entre semana
          </li>
          <li>
            5GB almacenamiento
          </li>
          <li> Prioridad de conexión</li>
        </ul>
              <button> Contrata ya</button>
    </div>
    <!--2--> 

      <div class="pricing-card">
  
      <h2>Estándar</h2>

        <div class="price"> $4.99/mes</div>
        <ul> 
          <li>
            Sin anuncios fines de semana
          </li>
          <li>
            +25GB almacenamiento
          </li>
          <li>
            Calidad Aumentada
          </li>

        </ul>
              <button> Contrata ya</button>
  </div>
    <!--3--> 

        <div class="pricing-card">
      <h2>Premium</h2>

        <div class="price"> $9.99/mes</div>
        <ul> 
          <li>
            Sin anuncios
          </li>
          <li>
            +500GB almacenamiento
          </li>
          <li>
            Felicidad
          </li>

        </ul>
              <button> Contrata ya</button>


  </div>

  </main>


    
</body>

</html>
